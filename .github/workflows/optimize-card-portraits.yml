name: Optimize transparent card portraits

on:
  push:
    paths:
      - '.github/workflows/optimize-card-portraits.yml'
      - 'scripts/optimize_portraits.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging tools
        run: python -m pip install 'Pillow==11.1.0'
      - name: Optimize card PNGs into transparent WebP
        run: python scripts/optimize_portraits.py
      - name: Publish optimized portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-cutouts/manifest.json card-cutouts/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize 27 transparent player cards for faster loading"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
