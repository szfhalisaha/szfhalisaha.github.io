name: Build player card cutouts

on:
  push:
    paths:
      - '.github/workflows/portrait-cutouts.yml'
      - 'scripts/generate_portraits.py'
      - 'portrait-source-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install segmentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg==2.0.67' 'onnxruntime==1.21.0' 'Pillow==11.1.0'
      - name: Generate cutouts from original Supabase photos
        run: python scripts/generate_portraits.py
      - name: Commit new cutouts and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-cutouts/
          if ! git diff --cached --quiet; then
            git commit -m "Generate high-quality transparent player portraits (originals preserved)"
            git push
          fi
