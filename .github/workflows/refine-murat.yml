name: Refine Murat card portrait
on:
  push:
    paths:
      - '.github/workflows/refine-murat.yml'
      - 'scripts/refine_murat_portrait.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow==11.1.0'
      - run: python scripts/refine_murat_portrait.py
      - name: Publish Murat only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-cutouts/ed6c37d5-da9c-49d6-9be8-c4bb06e8b7a4.webp
          if ! git diff --cached --quiet; then
            git commit -m "Enlarge Murat head and retain more chest like Deniz"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
